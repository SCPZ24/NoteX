services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.5
    profiles: ["governance"]
    command:
      - /usr/local/bin/etcd
      - --name=notex-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:23790
      - --listen-peer-urls=http://127.0.0.1:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=notex-etcd=http://127.0.0.1:2380
      - --quota-backend-bytes=134217728
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
      - --max-wals=2
      - --max-snapshots=2
    ports:
      - "127.0.0.1:23790:2379"
    cpus: 1
    mem_limit: 256m
    volumes:
      - etcd_data:/etcd-data
    logging:
      options:
        max-size: "10m"
        max-file: "2"
  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6380:6379"
    cpus: 1
    mem_limit: 1536m
    volumes:
      - redis_data:/data
    logging:
      options:
        max-size: "10m"
        max-file: "2"
  rabbitmq:
    image: rabbitmq:4.2-management@sha256:7fa20d0d23d63ed90499bbf62e24af48ec4ae5eb22d173f3db96e3f85b26884a
    hostname: notex-rabbitmq
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: notex
      RABBITMQ_DEFAULT_PASS: notex-local
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 -rabbit disk_free_limit 268435456"
    cpus: 2
    mem_limit: 768m
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    logging:
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  etcd_data:
  redis_data:
  rabbitmq_data:
